# /etc/nginx/sites-available/evidenceflow  (certbot --nginx adds the TLS server block)
server {
    listen 80;
    server_name wjnb.oneoneoneimno1.site;
    client_max_body_size 2m;

    location / {
        # Every request spends LLM credit; keep the page behind a password.
        auth_basic "EvidenceFlow";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering, long timeouts (a research run can take minutes)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header X-Accel-Buffering no;
    }
}
