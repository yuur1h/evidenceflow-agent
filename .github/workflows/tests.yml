name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen pytest tests -q
      - run: uv run --frozen python smoke_local.py
